spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: review-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/webhooks/**

server:
  port: 8080