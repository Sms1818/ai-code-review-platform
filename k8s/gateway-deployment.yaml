apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: ai-review

spec:
  replicas: 1

  selector:
    matchLabels:
      app: gateway-service

  template:
    metadata:
      labels:
        app: gateway-service

    spec:
      containers:
        - name: gateway-service

          image: ai-review/gateway-service:latest

          imagePullPolicy: Never

          ports:
            - containerPort: 8080
