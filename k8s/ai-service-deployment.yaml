apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-service
  namespace: ai-review

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ai-service

  template:
    metadata:
      labels:
        app: ai-service

    spec:
      containers:
        - name: ai-service

          image: ai-review/ai-service:latest

          imagePullPolicy: Never

          ports:
            - containerPort: 8083

          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-service-secret
                  key: GEMINI_API_KEY

            - name: BITBUCKET_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ai-service-secret
                  key: BITBUCKET_USERNAME

            - name: BITBUCKET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-service-secret
                  key: BITBUCKET_PASSWORD
