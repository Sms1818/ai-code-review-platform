apiVersion: apps/v1
kind: Deployment

metadata:
  name: review-service
  namespace: ai-review

spec:
  replicas: 1

  selector:
    matchLabels:
      app: review-service

  template:
    metadata:
      labels:
        app: review-service

    spec:
      containers:
        - name: review-service

          image: ai-review/review-service:latest

          imagePullPolicy: Never

          ports:
            - containerPort: 8082

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: review-service-secret
                  key: DB_PASSWORD
